name: Production Artifact

on:
  push:
    paths:
      - .github/workflows/production-artifact.yml
      - Dockerfile
      - .dockerignore
      - .env.example
      - package.json
      - package-lock.json
      - scripts/setup-fonts.js
      - next.config.ts
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact 40-character merged main SHA authorized by DevOps.
        required: true
        type: string

permissions:
  contents: read

env:
  ARTIFACT_REGISTRY_HOST: me-central2-docker.pkg.dev
  ARTIFACT_PACKAGE: me-central2-docker.pkg.dev/moazez-production/moazez-production-containers/moazez-school-dashboard
  PRODUCTION_API_URL: https://api.moazez.cloud/api/v1
  PRODUCTION_REALTIME_URL: https://api.moazez.cloud/api/v1/realtime
  PRODUCTION_REALTIME_SOCKET_PATH: /socket.io

jobs:
  validate-source:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact pushed source
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "Checked-out HEAD does not match GITHUB_SHA." >&2
            exit 1
          fi

      - name: Validate Production workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow_path = Path(".github/workflows/production-artifact.yml")
          text = workflow_path.read_text(encoding="utf-8")

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          checkout_sha = "3d3c42e5aac5ba805825da76410c181273ba90b1"
          auth_sha = "7c6bc770dae815cd3e89ee6cdf493a5fab2cc093"
          checkout_ref = "actions/check" + "out@" + checkout_sha
          auth_ref = "google-github-actions/" + "auth@" + auth_sha
          provider = (
              "projects/91001421934/locations/global/workloadIdentityPools/"
              "moazez-github-production/providers/moazez-school-dashboard-main"
          )
          service_account = (
              "moazez-ui-artifact-builder" + "@moazez-production.iam.gserviceaccount.com"
          )
          project_id = "moazez-production"
          artifact_package = (
              "me-central2-docker.pkg.dev/moazez-production/"
              "moazez-production-containers/moazez-school-dashboard"
          )
          api_url = "https://api." + "moazez.cloud/api/v1"
          realtime_url = api_url + "/realtime"
          socket_path = "/socket" + ".io"
          public_prefix = "NEXT_" + "PUBLIC_"
          production_prefix = "PRODUCTION_"
          maps_public_name = public_prefix + "GOOGLE_MAPS_API_KEY"
          maps_alias = production_prefix + "GOOGLE_MAPS_API_KEY"
          maps_expression = "$" + "{{ " + "vars." + maps_public_name + " }}"
          mobile_marker = "MOBILE_" + "APP_"
          mobile_roles = (
              ("STUDENT", "student"),
              ("TEACHER", "teacher"),
              ("PARENT", "parent"),
              ("DISMISSAL_" + "STAFF", "dismissal-staff"),
          )
          mobile_stores = (
              ("GOOGLE_" + "PLAY", "google-play", "play.google.com"),
              ("APP_" + "STORE", "app-store", "apps.apple.com"),
          )
          mobile_contracts = []
          for role_name, role_path in mobile_roles:
              for store_name, store_path, expected_hostname in mobile_stores:
                  mobile_suffix = mobile_marker + role_name + "_" + store_name + "_URL"
                  mobile_public_name = public_prefix + mobile_suffix
                  mobile_alias = production_prefix + mobile_suffix
                  mobile_expression = (
                      "$" + "{{ " + "vars." + mobile_public_name + " }}"
                  )
                  mobile_sentinel_name = "validation_" + mobile_suffix.lower()
                  mobile_sentinel_value = (
                      "https://example.invalid/moazez-pre35/"
                      + "${"
                      + "GITHUB_SHA}"
                      + "/"
                      + role_path
                      + "/"
                      + store_path
                  )
                  mobile_contracts.append(
                      (
                          mobile_public_name,
                          mobile_alias,
                          mobile_expression,
                          mobile_sentinel_name,
                          mobile_sentinel_value,
                          expected_hostname,
                      )
                  )
          mobile_contracts = tuple(mobile_contracts)
          expected_mobile_public_names = {
              contract[0] for contract in mobile_contracts
          }
          expected_mobile_aliases = {contract[1] for contract in mobile_contracts}
          require(
              len(mobile_contracts) == 8
              and len(expected_mobile_public_names) == 8
              and len(expected_mobile_aliases) == 8,
              "Mobile app store URL specification must define exactly eight contracts.",
          )

          require(text.count("uses: " + checkout_ref) == 2, "Unexpected checkout action references.")
          require(
              not re.search(r"uses:\s*actions/checkout@(?!" + re.escape(checkout_sha) + r")", text),
              "Unapproved checkout action reference.",
          )
          require(text.count("uses: " + auth_ref) == 1, "Unexpected Google auth action reference.")
          require(
              not re.search(
                  r"uses:\s*google-github-actions/auth@(?!" + re.escape(auth_sha) + r")",
                  text,
              ),
              "Unapproved Google auth action reference.",
          )

          required_fragments = [
              "workload_identity_provider: " + provider,
              "service_account: " + service_account,
              "project_id: " + project_id,
              "ARTIFACT_PACKAGE: " + artifact_package,
              "PRODUCTION_API_URL: " + api_url,
              "PRODUCTION_REALTIME_URL: " + realtime_url,
              "PRODUCTION_REALTIME_SOCKET_PATH: " + socket_path,
              "token_" + "format: access_token",
              "create_" + "credentials_file: false",
              "export_" + "environment_variables: false",
          ]
          for fragment in required_fragments:
              require(fragment in text, "Missing required Production contract value.")

          workflow_lines = text.splitlines()
          require(
              workflow_lines.count("  PRODUCTION_API_URL: " + api_url) == 1,
              "Production API URL assignment must be exact and unique.",
          )
          require(
              workflow_lines.count("  PRODUCTION_REALTIME_URL: " + realtime_url) == 1,
              "Production realtime URL assignment must be exact and unique.",
          )
          require(
              workflow_lines.count("  PRODUCTION_REALTIME_SOCKET_PATH: " + socket_path) == 1,
              "Production realtime socket path assignment must be exact and unique.",
          )
          old_api_assignment = (
              "  PRODUCTION_" + "API_URL: https://api." + "moazez.cloud"
          )
          require(
              old_api_assignment not in workflow_lines,
              "Unversioned Production API URL assignment is forbidden.",
          )

          dispatch_match = re.search(
              r"(?ms)^  workflow_dispatch:\s*\n(?P<body>.*?)(?=^\S)", text
          )
          require(dispatch_match is not None, "Missing workflow_dispatch trigger.")
          dispatch_body = dispatch_match.group("body")
          input_names = re.findall(r"(?m)^      ([a-zA-Z0-9_-]+):\s*$", dispatch_body)
          require(input_names == ["expected_source_sha"], "Unexpected workflow_dispatch inputs.")
          require(
              re.search(
                  r"(?ms)^      expected_source_sha:\s*\n"
                  r"        description: Exact 40-character merged main SHA authorized by DevOps\.\s*\n"
                  r"        required: true\s*\n"
                  r"        type: string\s*$",
                  dispatch_body,
              )
              is not None,
              "expected_source_sha must be a required string input.",
          )

          forbidden_patterns = [
              "credentials" + "_json",
              "GOOGLE_" + "APPLICATION_CREDENTIALS",
              "gha-" + "creds-",
              "gcloud auth " + "activate-service-account",
              "gcloud iam service-accounts keys " + "create",
              "google-github-actions/" + "deploy-cloudrun",
              "gcloud run " + "deploy",
              "terraform " + "init",
              "terraform " + "plan",
              "terraform " + "apply",
              "terraform " + "destroy",
              "gcloud " + "dns",
              "dns " + "record-sets",
              "contents" + ": write",
              "packages" + ": write",
              "actions" + ": write",
              "deployments" + ": write",
          ]
          lower_text = text.lower()
          for pattern in forbidden_patterns:
              require(pattern.lower() not in lower_text, "Forbidden operational or security pattern detected.")

          require(
              re.search(r"AIza[0-9A-Za-z_-]{20,}", text) is None,
              "Committed Google API key pattern detected.",
          )

          forbidden_public_names = [
              public_prefix + "REALTIME_DEBUG",
              public_prefix + "GOOGLE_MAPS_MAP_ID",
              public_prefix + "DEFAULT_SCHOOL_ID",
          ]
          for variable_name in forbidden_public_names:
              require(variable_name not in text, "Forbidden optional public value detected.")
          mobile_public_pattern = re.compile(
              r"\b" + re.escape(public_prefix + mobile_marker) + r"[A-Za-z0-9_]+\b"
          )
          observed_mobile_public_names = set(mobile_public_pattern.findall(text))
          require(
              observed_mobile_public_names == expected_mobile_public_names,
              "Mobile app public values do not match the exact authorized allowlist.",
          )

          build_arguments = re.findall(r"--build-arg\s+(NEXT_PUBLIC_[A-Za-z0-9_]+)=", text)
          expected_arguments = {
              public_prefix + "API_URL",
              public_prefix + "REALTIME_URL",
              public_prefix + "REALTIME_SOCKET_PATH",
              maps_public_name,
          } | expected_mobile_public_names
          require(len(expected_arguments) == 12, "Authorized public build argument model mismatch.")
          require(len(build_arguments) == 24, "Unexpected number of public Docker build arguments.")
          require(set(build_arguments) == expected_arguments, "Unexpected public Docker build argument.")
          for argument in expected_arguments:
              require(build_arguments.count(argument) == 2, "Required build argument count mismatch.")

          validate_header = re.search(r"(?m)^  validate-source:\s*$", text)
          publish_header = re.search(r"(?m)^  publish-production-artifact:\s*$", text)
          require(validate_header is not None, "Missing validate-source job.")
          require(
              publish_header is not None,
              "Missing publish-production-artifact job.",
          )
          require(
              validate_header.start() < publish_header.start(),
              "Workflow job ordering is invalid.",
          )
          validate_start = validate_header.start()
          publish_start = publish_header.start()
          validate_job = text[validate_start:publish_start]
          publish_job = text[publish_start:]

          def extract_step_body(job_source: str, step_name: str) -> str:
              step_pattern = re.compile(
                  r"(?ms)^      - name: "
                  + re.escape(step_name)
                  + r"[ \t]*\r?\n(?P<body>.*?)(?=^      - name: |\Z)"
              )
              matches = list(step_pattern.finditer(job_source))
              require(len(matches) == 1, "Required workflow step is missing or duplicated.")
              return matches[0].group("body")

          validation_build_step = extract_step_body(
              validate_job, "Build ephemeral local Production image"
          )
          validation_verify_step = extract_step_body(
              validate_job, "Verify ephemeral local Production image"
          )
          production_build_step = extract_step_body(
              publish_job, "Build exact Production image"
          )
          production_verify_step = extract_step_body(
              publish_job, "Verify local Production image"
          )
          validate_arguments = re.findall(
              r"--build-arg\s+(NEXT_PUBLIC_[A-Za-z0-9_]+)=", validate_job
          )
          publish_arguments = re.findall(
              r"--build-arg\s+(NEXT_PUBLIC_[A-Za-z0-9_]+)=", publish_job
          )
          require(
              len(validate_arguments) == 12 and set(validate_arguments) == expected_arguments,
              "Push validation build arguments do not match the authorized contract.",
          )
          require(
              len(publish_arguments) == 12 and set(publish_arguments) == expected_arguments,
              "Production build arguments do not match the authorized contract.",
          )
          for argument in expected_arguments:
              require(
                  validate_arguments.count(argument) == 1,
                  "Push validation build argument count mismatch.",
              )
              require(
                  publish_arguments.count(argument) == 1,
                  "Production build argument count mismatch.",
              )

          require(text.count(maps_expression) == 1, "Maps external configuration reference mismatch.")
          require(
              workflow_lines.count("      " + maps_alias + ": " + maps_expression) == 1,
              "Maps external configuration alias is missing or duplicated.",
          )
          require(
              maps_expression not in validate_job and maps_alias not in validate_job,
              "Push validation must not require Production Maps configuration.",
          )
          validation_sentinel_assignment = (
              'validation_maps_value="pt-1b-non-production-maps-'
              + 'validation-${GITHUB_SHA}"'
          )
          require(
              validate_job.count(validation_sentinel_assignment) == 2,
              "Push validation Maps sentinel is missing or duplicated.",
          )
          validation_maps_argument = (
              "--build-arg " + maps_public_name + '="${validation_maps_value}"'
          )
          production_maps_argument = (
              "--build-arg " + maps_public_name + '="${' + maps_alias + '}"'
          )
          require(
              validate_job.count(validation_maps_argument) == 1,
              "Push validation Maps build argument must use only its sentinel.",
          )
          require(
              publish_job.count(production_maps_argument) == 1,
              "Production Maps build argument must use the external configuration alias.",
          )
          maps_environment_extraction = "s/^" + maps_public_name + "=//p"
          validation_maps_comparison = (
              '[[ "${image_maps_values[0]}" != "$validation_'
              + 'maps_value" ]]'
          )
          production_maps_comparison = (
              '[[ "${image_maps_values[0]}" != "$' + maps_alias + '" ]]'
          )
          require(
              validate_job.count(maps_environment_extraction) == 1
              and validate_job.count(validation_maps_comparison) == 1,
              "Push validation image Maps verification contract mismatch.",
          )
          require(
              publish_job.count(maps_environment_extraction) == 1
              and publish_job.count(production_maps_comparison) == 1,
              "Production image Maps verification contract mismatch.",
          )

          publish_env_match = re.search(
              r"(?ms)^    env:[ \t]*\r?\n(?P<body>.*?)(?=^    [A-Za-z0-9_-]+:)",
              publish_job,
          )
          require(publish_env_match is not None, "Missing Production job environment block.")
          publish_env_lines = publish_env_match.group("body").splitlines()
          production_mobile_pattern = re.compile(
              r"\b" + re.escape(production_prefix + mobile_marker) + r"[A-Za-z0-9_]+\b"
          )
          require(
              set(production_mobile_pattern.findall(text)) == expected_mobile_aliases,
              "Production mobile aliases do not match the exact authorized allowlist.",
          )

          mobile_verification_command = "require_" + "mobile_image_environment_value"
          mobile_verification_definition = mobile_verification_command + "() {"
          mobile_environment_extraction = (
              'sed -n "s/^${environment_'
              + 'name}=//p" <<<"$image_'
              + 'environment"'
          )
          mobile_count_condition = (
              '[[ "${#image_' + 'mobile_values[@]}" -ne 1 ]]'
          )
          mobile_comparison_condition = (
              '[[ "${image_'
              + 'mobile_values[0]}" != "$expected_'
              + 'value" ]]'
          )

          def extract_mobile_verification_function_body(
              verification_step: str,
          ) -> str:
              function_pattern = re.compile(
                  r"(?ms)^          "
                  + re.escape(mobile_verification_command)
                  + r"\(\)[ \t]+\{[ \t]*\r?\n"
                  + r"(?P<body>.*?)(?=^          \}[ \t]*$)"
              )
              matches = list(function_pattern.finditer(verification_step))
              require(
                  len(matches) == 1
                  and verification_step.count(mobile_verification_definition) == 1,
                  "Mobile image verification helper is missing or duplicated.",
              )
              return matches[0].group("body")

          validation_mobile_function_body = (
              extract_mobile_verification_function_body(validation_verify_step)
          )
          production_mobile_function_body = (
              extract_mobile_verification_function_body(production_verify_step)
          )
          for function_body, job_label in (
              (validation_mobile_function_body, "Push validation"),
              (production_mobile_function_body, "Production"),
          ):
              function_lines = function_body.splitlines()
              require(
                  function_body.count('local environment_name="$1"') == 1
                  and function_body.count('local expected_value="$2"') == 1
                  and function_body.count("local -a image_mobile_values") == 1
                  and function_body.count(mobile_environment_extraction) == 1
                  and function_body.count(mobile_count_condition) == 1
                  and function_body.count(mobile_comparison_condition) == 1
                  and function_lines.count("              exit 1") == 1,
                  job_label + " mobile image verification primitive mismatch.",
              )

          for (
              mobile_public_name,
              mobile_alias,
              mobile_expression,
              mobile_sentinel_name,
              mobile_sentinel_value,
              _expected_hostname,
          ) in mobile_contracts:
              mobile_env_assignment = (
                  "      " + mobile_alias + ": " + mobile_expression
              )
              repository_variable_pattern = re.compile(
                  r"\bvars[ \t]*(?:\.[ \t]*"
                  + re.escape(mobile_public_name)
                  + r"\b|\[[ \t]*[\"']"
                  + re.escape(mobile_public_name)
                  + r"[\"'][ \t]*\])"
              )
              secret_variable_pattern = re.compile(
                  r"\bsecrets[ \t]*(?:\.[ \t]*"
                  + re.escape(mobile_public_name)
                  + r"\b|\[[ \t]*[\"']"
                  + re.escape(mobile_public_name)
                  + r"[\"'][ \t]*\])"
              )
              require(
                  text.count(mobile_expression) == 1,
                  "Mobile repository-variable expression must be exact and unique.",
              )
              require(
                  len(list(repository_variable_pattern.finditer(text))) == 1
                  and len(list(repository_variable_pattern.finditer(publish_job))) == 1
                  and repository_variable_pattern.search(validate_job) is None,
                  "Mobile repository-variable reference must exist only in Production.",
              )
              require(
                  secret_variable_pattern.search(text) is None,
                  "Mobile browser configuration must not use GitHub secrets.",
              )
              require(
                  workflow_lines.count(mobile_env_assignment) == 1
                  and publish_env_lines.count(mobile_env_assignment) == 1,
                  "Production mobile job-level alias mapping is missing or duplicated.",
              )
              require(
                  mobile_expression not in validate_job
                  and mobile_alias not in validate_job,
                  "Push validation must not require Production mobile configuration.",
              )

              mobile_sentinel_assignment = (
                  mobile_sentinel_name + '="' + mobile_sentinel_value + '"'
              )
              require(
                  validate_job.count(mobile_sentinel_assignment) == 2
                  and validate_job.count(mobile_sentinel_value) == 2
                  and validation_build_step.count(mobile_sentinel_assignment) == 1
                  and validation_verify_step.count(mobile_sentinel_assignment) == 1,
                  "Push validation mobile sentinel is missing or duplicated.",
              )
              validation_mobile_argument = (
                  "--build-arg "
                  + mobile_public_name
                  + '="${'
                  + mobile_sentinel_name
                  + '}"'
              )
              production_mobile_argument = (
                  "--build-arg "
                  + mobile_public_name
                  + '="${'
                  + mobile_alias
                  + '}"'
              )
              require(
                  validation_build_step.count(validation_mobile_argument) == 1,
                  "Push validation mobile build argument must use only its sentinel.",
              )
              require(
                  production_build_step.count(production_mobile_argument) == 1,
                  "Production mobile build argument must use its external alias.",
              )

              validation_mobile_verification = (
                  mobile_verification_command
                  + " "
                  + mobile_public_name
                  + ' "$'
                  + mobile_sentinel_name
                  + '"'
              )
              production_mobile_verification = (
                  mobile_verification_command
                  + " "
                  + mobile_public_name
                  + ' "$'
                  + mobile_alias
                  + '"'
              )
              require(
                  validation_verify_step.count(validation_mobile_verification) == 1,
                  "Push image mobile verification must compare with its sentinel.",
              )
              require(
                  production_verify_step.count(production_mobile_verification) == 1,
                  "Production image mobile verification must compare with its alias.",
              )
              require(
                  validation_mobile_verification not in validation_mobile_function_body
                  and production_mobile_verification
                  not in production_mobile_function_body,
                  "Mobile image verification calls must execute outside their helper.",
              )
              require(
                  validation_verify_step.index(mobile_verification_definition)
                  < validation_verify_step.index(validation_mobile_verification)
                  and production_verify_step.index(mobile_verification_definition)
                  < production_verify_step.index(production_mobile_verification),
                  "Mobile image verification helper must be defined before use.",
              )

          maps_guard_name = "Require external Google Maps browser configuration"
          maps_missing_condition = 'if [[ -z "${' + maps_alias + ':-}" ]]; then'
          maps_missing_message = "Required Google Maps browser " + "configuration is missing."
          require(publish_job.count(maps_guard_name) == 1, "Maps configuration guard mismatch.")
          require(
              publish_job.count(maps_missing_condition) == 1,
              "Maps configuration guard must fail closed on an empty value.",
          )
          require(
              publish_job.count(maps_missing_message) == 1,
              "Maps configuration guard message mismatch.",
          )
          require(
              publish_job.index(maps_guard_name) < publish_job.index("uses: " + auth_ref),
              "Maps configuration guard must execute before Google authentication.",
          )

          mobile_guard_name = "Require external mobile " + "app store URL configuration"
          mobile_guard_line = "      - name: " + mobile_guard_name
          require(
              workflow_lines.count(mobile_guard_line) == 1,
              "Mobile configuration guard step must be exact and unique.",
          )
          mobile_guard_match = re.search(
              r"(?ms)^"
              + re.escape(mobile_guard_line)
              + r"\r?\n(?P<body>.*?)(?=^      - name: |\Z)",
              publish_job,
          )
          require(
              mobile_guard_match is not None,
              "Mobile configuration guard must be inside the Production publishing job.",
          )
          mobile_guard_body = mobile_guard_match.group("body")
          require(
              len(
                  re.findall(
                      r"(?m)^          contracts[ \t]*=", mobile_guard_body
                  )
              )
              == 1,
              "Mobile configuration guard contracts must be assigned exactly once.",
          )
          require(
              mobile_guard_body.count("contracts") == 2,
              "Mobile configuration guard must use only its defined contracts tuple.",
          )
          mobile_guard_contracts_match = re.search(
              r"(?ms)^          contracts = \([ \t]*\r?\n"
              r"(?P<body>.*?)(?=^          \)[ \t]*$)",
              mobile_guard_body,
          )
          require(
              mobile_guard_contracts_match is not None,
              "Mobile configuration guard must define its contracts tuple.",
          )
          mobile_guard_contracts_body = mobile_guard_contracts_match.group("body")
          observed_guard_contract_lines = [
              line.strip()
              for line in mobile_guard_contracts_body.splitlines()
              if line.strip()
          ]
          expected_guard_contract_lines = {
              '("' + contract[1] + '", "' + contract[5] + '"),'
              for contract in mobile_contracts
          }
          require(
              len(observed_guard_contract_lines) == 8
              and set(observed_guard_contract_lines)
              == expected_guard_contract_lines,
              "Mobile configuration guard tuple must contain exactly eight contracts.",
          )
          require(
              set(production_mobile_pattern.findall(mobile_guard_contracts_body))
              == expected_mobile_aliases,
              "Mobile configuration guard must validate exactly eight aliases.",
          )
          for (
              _mobile_public_name,
              mobile_alias,
              _mobile_expression,
              _mobile_sentinel_name,
              _mobile_sentinel_value,
              expected_hostname,
          ) in mobile_contracts:
              guard_contract = '("' + mobile_alias + '", "' + expected_hostname + '"),'
              require(
                  mobile_guard_contracts_body.count(guard_contract) == 1,
                  "Mobile configuration guard alias/hostname contract mismatch.",
              )
          required_mobile_guard_fragments = [
              "set -euo pipefail",
              "python3 - <<'PY'",
              "import os",
              "from posixpath import normpath",
              "from urllib.parse import unquote, urlsplit",
              "for configuration_name, expected_hostname in contracts:",
              "value = os.environ.get(configuration_name)",
              "if not value:",
              "parsed = urlsplit(value)",
              "parsed_port = parsed.port",
              "except (TypeError, ValueError):",
              'parsed.scheme != "https"',
              "parsed.hostname != expected_hostname",
              "parsed.netloc != expected_hostname",
              "parsed.username is not None",
              "parsed.password is not None",
              "parsed_port is not None",
              'explicit_port = ":" in authority',
              "or explicit_port",
              "decoded_path = unquote(parsed.path)",
              'normalized_path = normpath("/" + decoded_path.lstrip("/"))',
              'normalized_path != "/"',
              'normalized_path.strip("/").strip()',
              "or not meaningful_path",
              "any(character.isspace() for character in value)",
          ]
          for fragment in required_mobile_guard_fragments:
              require(
                  fragment in mobile_guard_body,
                  "Mobile configuration guard is missing a fail-closed URL check.",
              )
          require(
              mobile_guard_body.count("raise SystemExit(") == 3,
              "Mobile configuration guard must fail closed on missing or invalid values.",
          )
          for forbidden_guard_network_pattern in (
              "curl ",
              "wget ",
              "urllib.request",
              "http.client",
              "requests.",
          ):
              require(
                  forbidden_guard_network_pattern not in mobile_guard_body,
                  "Mobile configuration guard must not perform network requests.",
              )
          require(
              "{value}" not in mobile_guard_body
              and re.search(r"\bprint\s*\(\s*value\b", mobile_guard_body) is None,
              "Mobile configuration guard must not print configured URL values.",
          )
          require(
              publish_job.index("Enforce fail-closed exact-source guards")
              < publish_job.index(maps_guard_name)
              < publish_job.index(mobile_guard_name)
              < publish_job.index("uses: " + auth_ref),
              "Source, Maps, and mobile guards must execute in order before Google authentication.",
          )

          maps_value_references = [maps_alias, "image_maps_values", "image_environment"]
          for value_reference in maps_value_references:
              require(
                  re.search(
                      r"(?mi)^\s*(?:echo|printf)\b[^\n]*\$\{?"
                      + re.escape(value_reference)
                      + r"(?:\[[^\]]+\])?\}?",
                      text,
                  )
                  is None,
                  "Maps configuration value must not be printed.",
              )
          require(
              re.search(r"(?m)^\s*set\s+-[^\n]*x", text) is None
              and ("x" + "trace") not in lower_text,
              "Shell tracing is forbidden.",
          )
          for line in workflow_lines:
              if any(value_reference in line for value_reference in maps_value_references):
                  require(
                      "GITHUB_OUTPUT" not in line and "GITHUB_STEP_SUMMARY" not in line,
                      "Maps configuration value must not be written to workflow outputs.",
                  )
          maps_summary = "Google Maps browser configuration: externally " + "configured"
          require(maps_summary in publish_job, "Non-sensitive Maps handoff summary is missing.")
          mobile_value_references = (
              [contract[1] for contract in mobile_contracts]
              + [contract[3] for contract in mobile_contracts]
              + ["image_" + "mobile_values", "expected_" + "value"]
          )
          for value_reference in mobile_value_references:
              require(
                  re.search(
                      r"(?mi)^\s*(?:echo|printf)\b[^\n]*\$\{?"
                      + re.escape(value_reference)
                      + r"(?:\[[^\]]+\])?\}?",
                      text,
                  )
                  is None,
                  "Mobile app store URL values must not be printed.",
              )
              for line in workflow_lines:
                  if value_reference in line:
                      require(
                          "GITHUB_OUTPUT" not in line
                          and "GITHUB_STEP_SUMMARY" not in line,
                          "Mobile app store URL values must not be written to workflow outputs.",
                      )
          mobile_summary = "Mobile app store URLs: externally " + "configured"
          require(
              publish_job.count(mobile_summary) == 1,
              "Non-sensitive mobile app store URL handoff summary is missing or duplicated.",
          )

          oidc_permission = "id-" + "token:"
          require(oidc_permission not in validate_job, "Push validation job must not receive an OIDC token.")
          require(auth_ref not in validate_job, "Push validation job must not authenticate to Google Cloud.")
          require("docker " + "login" not in validate_job, "Push validation job must not log in to a registry.")
          require("docker " + "push" not in validate_job, "Push validation job must not push an image.")
          require("if: github.event_name == 'workflow_dispatch'" in publish_job, "Publishing job is not manual-only.")
          require(oidc_permission + " write" in publish_job, "Publishing job lacks OIDC permission.")
          require(
              publish_job.index("Enforce fail-closed exact-source guards")
              < publish_job.index("uses: " + auth_ref),
              "Exact-source guards must execute before Google authentication.",
          )
          require(
              len(re.findall(r"(?m)^\s*docker " + "push ", text)) == 1,
              "Production workflow must have exactly one Docker push path.",
          )
          PY

      - name: Build ephemeral local Production image
        shell: bash
        run: |
          set -euo pipefail
          validation_image="school-dashboard-validation:${GITHUB_SHA}"
          validation_maps_value="pt-1b-non-production-maps-validation-${GITHUB_SHA}"
          validation_mobile_app_student_google_play_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/student/google-play"
          validation_mobile_app_student_app_store_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/student/app-store"
          validation_mobile_app_teacher_google_play_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/teacher/google-play"
          validation_mobile_app_teacher_app_store_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/teacher/app-store"
          validation_mobile_app_parent_google_play_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/parent/google-play"
          validation_mobile_app_parent_app_store_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/parent/app-store"
          validation_mobile_app_dismissal_staff_google_play_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/dismissal-staff/google-play"
          validation_mobile_app_dismissal_staff_app_store_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/dismissal-staff/app-store"
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL="${PRODUCTION_API_URL}" \
            --build-arg NEXT_PUBLIC_REALTIME_URL="${PRODUCTION_REALTIME_URL}" \
            --build-arg NEXT_PUBLIC_REALTIME_SOCKET_PATH="${PRODUCTION_REALTIME_SOCKET_PATH}" \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="${validation_maps_value}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_STUDENT_GOOGLE_PLAY_URL="${validation_mobile_app_student_google_play_url}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_STUDENT_APP_STORE_URL="${validation_mobile_app_student_app_store_url}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_TEACHER_GOOGLE_PLAY_URL="${validation_mobile_app_teacher_google_play_url}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_TEACHER_APP_STORE_URL="${validation_mobile_app_teacher_app_store_url}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_PARENT_GOOGLE_PLAY_URL="${validation_mobile_app_parent_google_play_url}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_PARENT_APP_STORE_URL="${validation_mobile_app_parent_app_store_url}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_DISMISSAL_STAFF_GOOGLE_PLAY_URL="${validation_mobile_app_dismissal_staff_google_play_url}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_DISMISSAL_STAFF_APP_STORE_URL="${validation_mobile_app_dismissal_staff_app_store_url}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$validation_image" \
            .

      - name: Verify ephemeral local Production image
        shell: bash
        run: |
          set -euo pipefail
          validation_image="school-dashboard-validation:${GITHUB_SHA}"
          validation_maps_value="pt-1b-non-production-maps-validation-${GITHUB_SHA}"
          validation_mobile_app_student_google_play_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/student/google-play"
          validation_mobile_app_student_app_store_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/student/app-store"
          validation_mobile_app_teacher_google_play_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/teacher/google-play"
          validation_mobile_app_teacher_app_store_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/teacher/app-store"
          validation_mobile_app_parent_google_play_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/parent/google-play"
          validation_mobile_app_parent_app_store_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/parent/app-store"
          validation_mobile_app_dismissal_staff_google_play_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/dismissal-staff/google-play"
          validation_mobile_app_dismissal_staff_app_store_url="https://example.invalid/moazez-pre35/${GITHUB_SHA}/dismissal-staff/app-store"
          actual_revision="$(
            docker image inspect "$validation_image" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )"
          if [[ "$actual_revision" != "$GITHUB_SHA" ]]; then
            echo "Local image OCI revision does not match GITHUB_SHA." >&2
            exit 1
          fi

          image_environment="$(
            docker image inspect "$validation_image" \
              --format '{{ range .Config.Env }}{{ println . }}{{ end }}'
          )"
          for required_value in \
            "NEXT_PUBLIC_API_URL=${PRODUCTION_API_URL}" \
            "NEXT_PUBLIC_REALTIME_URL=${PRODUCTION_REALTIME_URL}" \
            "NEXT_PUBLIC_REALTIME_SOCKET_PATH=${PRODUCTION_REALTIME_SOCKET_PATH}"
          do
            if [[ "$(grep -Fxc -- "$required_value" <<<"$image_environment")" -ne 1 ]]; then
              echo "Required runtime environment value is missing or duplicated." >&2
              exit 1
            fi
          done

          mapfile -t image_maps_values < <(
            sed -n 's/^NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=//p' <<<"$image_environment"
          )
          if [[ "${#image_maps_values[@]}" -ne 1 ]] \
            || [[ "${image_maps_values[0]}" != "$validation_maps_value" ]]; then
            echo "Validation image Maps browser configuration mismatch." >&2
            exit 1
          fi

          require_mobile_image_environment_value() {
            local environment_name="$1"
            local expected_value="$2"
            local -a image_mobile_values
            mapfile -t image_mobile_values < <(
              sed -n "s/^${environment_name}=//p" <<<"$image_environment"
            )
            if [[ "${#image_mobile_values[@]}" -ne 1 ]] \
              || [[ "${image_mobile_values[0]}" != "$expected_value" ]]; then
              echo "Validation image mobile app store URL configuration mismatch." >&2
              exit 1
            fi
          }

          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_STUDENT_GOOGLE_PLAY_URL "$validation_mobile_app_student_google_play_url"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_STUDENT_APP_STORE_URL "$validation_mobile_app_student_app_store_url"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_TEACHER_GOOGLE_PLAY_URL "$validation_mobile_app_teacher_google_play_url"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_TEACHER_APP_STORE_URL "$validation_mobile_app_teacher_app_store_url"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_PARENT_GOOGLE_PLAY_URL "$validation_mobile_app_parent_google_play_url"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_PARENT_APP_STORE_URL "$validation_mobile_app_parent_app_store_url"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_DISMISSAL_STAFF_GOOGLE_PLAY_URL "$validation_mobile_app_dismissal_staff_google_play_url"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_DISMISSAL_STAFF_APP_STORE_URL "$validation_mobile_app_dismissal_staff_app_store_url"

  publish-production-artifact:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PRODUCTION_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      PRODUCTION_MOBILE_APP_STUDENT_GOOGLE_PLAY_URL: ${{ vars.NEXT_PUBLIC_MOBILE_APP_STUDENT_GOOGLE_PLAY_URL }}
      PRODUCTION_MOBILE_APP_STUDENT_APP_STORE_URL: ${{ vars.NEXT_PUBLIC_MOBILE_APP_STUDENT_APP_STORE_URL }}
      PRODUCTION_MOBILE_APP_TEACHER_GOOGLE_PLAY_URL: ${{ vars.NEXT_PUBLIC_MOBILE_APP_TEACHER_GOOGLE_PLAY_URL }}
      PRODUCTION_MOBILE_APP_TEACHER_APP_STORE_URL: ${{ vars.NEXT_PUBLIC_MOBILE_APP_TEACHER_APP_STORE_URL }}
      PRODUCTION_MOBILE_APP_PARENT_GOOGLE_PLAY_URL: ${{ vars.NEXT_PUBLIC_MOBILE_APP_PARENT_GOOGLE_PLAY_URL }}
      PRODUCTION_MOBILE_APP_PARENT_APP_STORE_URL: ${{ vars.NEXT_PUBLIC_MOBILE_APP_PARENT_APP_STORE_URL }}
      PRODUCTION_MOBILE_APP_DISMISSAL_STAFF_GOOGLE_PLAY_URL: ${{ vars.NEXT_PUBLIC_MOBILE_APP_DISMISSAL_STAFF_GOOGLE_PLAY_URL }}
      PRODUCTION_MOBILE_APP_DISMISSAL_STAFF_APP_STORE_URL: ${{ vars.NEXT_PUBLIC_MOBILE_APP_DISMISSAL_STAFF_APP_STORE_URL }}
    concurrency:
      group: production-artifact-${{ github.repository_id }}-${{ github.event.inputs.expected_source_sha }}
      cancel-in-progress: false
    outputs:
      source_sha: ${{ steps.publish-result.outputs.source_sha }}
      image_tag: ${{ steps.publish-result.outputs.image_tag }}
      image_digest: ${{ steps.publish-result.outputs.image_digest }}
      immutable_ref: ${{ steps.publish-result.outputs.immutable_ref }}
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enforce fail-closed exact-source guards
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "Abdallah-Mohamed-Abdallah-AbdulRazzaq/Moazez-School-Dashboard" ]]; then
            echo "Repository guard failed." >&2
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY_ID" != "1335686453" ]]; then
            echo "Repository ID guard failed." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Main ref guard failed." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected source SHA must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "Event SHA does not match the DevOps-authorized source SHA." >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "Checked-out HEAD does not match GITHUB_SHA." >&2
            exit 1
          fi

      - name: Require external Google Maps browser configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PRODUCTION_GOOGLE_MAPS_API_KEY:-}" ]]; then
            echo "Required Google Maps browser configuration is missing." >&2
            exit 1
          fi

      - name: Require external mobile app store URL configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from posixpath import normpath
          from urllib.parse import unquote, urlsplit

          contracts = (
              ("PRODUCTION_MOBILE_APP_STUDENT_GOOGLE_PLAY_URL", "play.google.com"),
              ("PRODUCTION_MOBILE_APP_STUDENT_APP_STORE_URL", "apps.apple.com"),
              ("PRODUCTION_MOBILE_APP_TEACHER_GOOGLE_PLAY_URL", "play.google.com"),
              ("PRODUCTION_MOBILE_APP_TEACHER_APP_STORE_URL", "apps.apple.com"),
              ("PRODUCTION_MOBILE_APP_PARENT_GOOGLE_PLAY_URL", "play.google.com"),
              ("PRODUCTION_MOBILE_APP_PARENT_APP_STORE_URL", "apps.apple.com"),
              ("PRODUCTION_MOBILE_APP_DISMISSAL_STAFF_GOOGLE_PLAY_URL", "play.google.com"),
              ("PRODUCTION_MOBILE_APP_DISMISSAL_STAFF_APP_STORE_URL", "apps.apple.com"),
          )

          for configuration_name, expected_hostname in contracts:
              value = os.environ.get(configuration_name)
              if not value:
                  raise SystemExit(
                      f"Required mobile app store URL configuration is missing: {configuration_name}."
                  )
              try:
                  parsed = urlsplit(value)
                  parsed_port = parsed.port
              except (TypeError, ValueError):
                  raise SystemExit(
                      f"Invalid mobile app store URL configuration: {configuration_name}."
                  ) from None

              authority = parsed.netloc.rsplit("@", 1)[-1]
              explicit_port = ":" in authority
              decoded_path = unquote(parsed.path)
              normalized_path = normpath("/" + decoded_path.lstrip("/"))
              meaningful_path = (
                  normalized_path != "/"
                  and bool(normalized_path.strip("/").strip())
              )
              if (
                  parsed.scheme != "https"
                  or parsed.hostname != expected_hostname
                  or parsed.netloc != expected_hostname
                  or parsed.username is not None
                  or parsed.password is not None
                  or parsed_port is not None
                  or explicit_port
                  or not meaningful_path
                  or any(character.isspace() for character in value)
              ):
                  raise SystemExit(
                      f"Invalid mobile app store URL configuration: {configuration_name}."
                  )
          PY

      - name: Authenticate with dedicated Production artifact identity
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/91001421934/locations/global/workloadIdentityPools/moazez-github-production/providers/moazez-school-dashboard-main
          service_account: moazez-ui-artifact-builder@moazez-production.iam.gserviceaccount.com
          project_id: moazez-production
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate Docker to Production Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ steps.gcp-auth.outputs.access_token }}' \
            | docker login \
                --username oauth2accesstoken \
                --password-stdin \
                "$ARTIFACT_REGISTRY_HOST"

      - name: Refuse remote source-SHA tag overwrite
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${ARTIFACT_PACKAGE}:${GITHUB_SHA}"
          inspection_output_file="$(mktemp)"
          trap 'rm -f "$inspection_output_file"' EXIT

          if docker buildx imagetools inspect "$image_tag" >"$inspection_output_file" 2>&1; then
            existing_digest="$(
              sed -nE 's/^[[:space:]]*Digest:[[:space:]]*(sha256:[0-9a-f]{64})[[:space:]]*$/\1/p' \
                "$inspection_output_file" \
                | head -n 1
            )"
            if [[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Refusing to overwrite existing artifact: ${ARTIFACT_PACKAGE}@${existing_digest}" >&2
            else
              echo "Refusing to overwrite the existing source-SHA tag; its digest could not be safely resolved." >&2
            fi
            exit 1
          fi

          absence_proven=false
          if grep -Fxiq -- "ERROR: ${image_tag}: not found" "$inspection_output_file"; then
            absence_proven=true
          elif grep -Fi -- "$image_tag" "$inspection_output_file" | grep -Fiq -- "manifest unknown"; then
            absence_proven=true
          fi
          if [[ "$absence_proven" != "true" ]]; then
            echo "Registry inspection failed for a reason that does not prove tag absence." >&2
            exit 1
          fi

      - name: Build exact Production image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${ARTIFACT_PACKAGE}:${GITHUB_SHA}"
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL="${PRODUCTION_API_URL}" \
            --build-arg NEXT_PUBLIC_REALTIME_URL="${PRODUCTION_REALTIME_URL}" \
            --build-arg NEXT_PUBLIC_REALTIME_SOCKET_PATH="${PRODUCTION_REALTIME_SOCKET_PATH}" \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="${PRODUCTION_GOOGLE_MAPS_API_KEY}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_STUDENT_GOOGLE_PLAY_URL="${PRODUCTION_MOBILE_APP_STUDENT_GOOGLE_PLAY_URL}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_STUDENT_APP_STORE_URL="${PRODUCTION_MOBILE_APP_STUDENT_APP_STORE_URL}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_TEACHER_GOOGLE_PLAY_URL="${PRODUCTION_MOBILE_APP_TEACHER_GOOGLE_PLAY_URL}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_TEACHER_APP_STORE_URL="${PRODUCTION_MOBILE_APP_TEACHER_APP_STORE_URL}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_PARENT_GOOGLE_PLAY_URL="${PRODUCTION_MOBILE_APP_PARENT_GOOGLE_PLAY_URL}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_PARENT_APP_STORE_URL="${PRODUCTION_MOBILE_APP_PARENT_APP_STORE_URL}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_DISMISSAL_STAFF_GOOGLE_PLAY_URL="${PRODUCTION_MOBILE_APP_DISMISSAL_STAFF_GOOGLE_PLAY_URL}" \
            --build-arg NEXT_PUBLIC_MOBILE_APP_DISMISSAL_STAFF_APP_STORE_URL="${PRODUCTION_MOBILE_APP_DISMISSAL_STAFF_APP_STORE_URL}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image_tag" \
            .

      - name: Verify local Production image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${ARTIFACT_PACKAGE}:${GITHUB_SHA}"
          actual_revision="$(
            docker image inspect "$image_tag" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )"
          if [[ "$actual_revision" != "$GITHUB_SHA" ]]; then
            echo "Production image OCI revision does not match GITHUB_SHA." >&2
            exit 1
          fi

          image_environment="$(
            docker image inspect "$image_tag" \
              --format '{{ range .Config.Env }}{{ println . }}{{ end }}'
          )"
          for required_value in \
            "NEXT_PUBLIC_API_URL=${PRODUCTION_API_URL}" \
            "NEXT_PUBLIC_REALTIME_URL=${PRODUCTION_REALTIME_URL}" \
            "NEXT_PUBLIC_REALTIME_SOCKET_PATH=${PRODUCTION_REALTIME_SOCKET_PATH}"
          do
            if [[ "$(grep -Fxc -- "$required_value" <<<"$image_environment")" -ne 1 ]]; then
              echo "Required runtime environment value is missing or duplicated." >&2
              exit 1
            fi
          done

          mapfile -t image_maps_values < <(
            sed -n 's/^NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=//p' <<<"$image_environment"
          )
          if [[ "${#image_maps_values[@]}" -ne 1 ]] \
            || [[ "${image_maps_values[0]}" != "$PRODUCTION_GOOGLE_MAPS_API_KEY" ]]; then
            echo "Production image Maps browser configuration mismatch." >&2
            exit 1
          fi

          require_mobile_image_environment_value() {
            local environment_name="$1"
            local expected_value="$2"
            local -a image_mobile_values
            mapfile -t image_mobile_values < <(
              sed -n "s/^${environment_name}=//p" <<<"$image_environment"
            )
            if [[ "${#image_mobile_values[@]}" -ne 1 ]] \
              || [[ "${image_mobile_values[0]}" != "$expected_value" ]]; then
              echo "Production image mobile app store URL configuration mismatch." >&2
              exit 1
            fi
          }

          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_STUDENT_GOOGLE_PLAY_URL "$PRODUCTION_MOBILE_APP_STUDENT_GOOGLE_PLAY_URL"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_STUDENT_APP_STORE_URL "$PRODUCTION_MOBILE_APP_STUDENT_APP_STORE_URL"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_TEACHER_GOOGLE_PLAY_URL "$PRODUCTION_MOBILE_APP_TEACHER_GOOGLE_PLAY_URL"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_TEACHER_APP_STORE_URL "$PRODUCTION_MOBILE_APP_TEACHER_APP_STORE_URL"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_PARENT_GOOGLE_PLAY_URL "$PRODUCTION_MOBILE_APP_PARENT_GOOGLE_PLAY_URL"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_PARENT_APP_STORE_URL "$PRODUCTION_MOBILE_APP_PARENT_APP_STORE_URL"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_DISMISSAL_STAFF_GOOGLE_PLAY_URL "$PRODUCTION_MOBILE_APP_DISMISSAL_STAFF_GOOGLE_PLAY_URL"
          require_mobile_image_environment_value NEXT_PUBLIC_MOBILE_APP_DISMISSAL_STAFF_APP_STORE_URL "$PRODUCTION_MOBILE_APP_DISMISSAL_STAFF_APP_STORE_URL"

      - name: Push source-SHA Production tag
        shell: bash
        run: |
          set -euo pipefail
          docker push "${ARTIFACT_PACKAGE}:${GITHUB_SHA}"

      - name: Resolve and verify immutable remote digest
        id: publish-result
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${ARTIFACT_PACKAGE}:${GITHUB_SHA}"
          remote_inspection="$(docker buildx imagetools inspect "$image_tag")"
          remote_digest="$(
            sed -nE 's/^[[:space:]]*Digest:[[:space:]]*(sha256:[0-9a-f]{64})[[:space:]]*$/\1/p' \
              <<<"$remote_inspection" \
              | head -n 1
          )"
          if [[ ! "$remote_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Remote registry manifest digest is missing or invalid." >&2
            exit 1
          fi

          immutable_ref="${ARTIFACT_PACKAGE}@${remote_digest}"
          docker buildx imagetools inspect "$immutable_ref" >/dev/null

          {
            echo "source_sha=${GITHUB_SHA}"
            echo "image_tag=${image_tag}"
            echo "image_digest=${remote_digest}"
            echo "immutable_ref=${immutable_ref}"
          } >>"$GITHUB_OUTPUT"

          {
            echo "## Production Artifact"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Source SHA: ${GITHUB_SHA}"
            echo "- Production API URL: ${PRODUCTION_API_URL}"
            echo "- Production Realtime URL: ${PRODUCTION_REALTIME_URL}"
            echo "- Production Realtime Socket Path: ${PRODUCTION_REALTIME_SOCKET_PATH}"
            echo "- Google Maps browser configuration: externally configured"
            echo "- Mobile app store URLs: externally configured"
            echo "- Artifact Registry package: ${ARTIFACT_PACKAGE}"
            echo "- Source-SHA tag: ${image_tag}"
            echo "- Remote sha256 digest: ${remote_digest}"
            echo "- Immutable reference: ${immutable_ref}"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Log out of Production Artifact Registry
        if: always()
        shell: bash
        run: docker logout me-central2-docker.pkg.dev || true
