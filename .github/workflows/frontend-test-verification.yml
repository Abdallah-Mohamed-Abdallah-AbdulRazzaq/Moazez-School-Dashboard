name: Frontend test verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-verification:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Africa/Cairo
      VITEST_MAX_FORKS: "2"
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_THREADS: "2"
      VITEST_MIN_THREADS: "1"
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify source authority
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo "TESTED_SOURCE_SHA=$(git rev-parse HEAD)"
          git diff --quiet

      - name: Set up the release Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install locked dependencies
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
          git diff --quiet

      - name: Restrict verification to local services
        run: |
          cat > "$RUNNER_TEMP/fr05c-network-guard.cjs" <<'GUARD'
          'use strict';
          const fs = require('node:fs');
          const net = require('node:net');
          const path = require('node:path');
          const logPath = path.join(__dirname, 'fr05c-network-blocks.jsonl');
          const originalConnect = net.Socket.prototype.connect;
          net.Socket.prototype.connect = function (...args) {
            const [options] = net._normalizeArgs(args);
            if (!options.path) {
              const host = String(options.host || 'localhost').toLowerCase().replace(/^\[|\]$/g, '');
              const loopback = host === 'localhost' || host === '::1' || host === '0:0:0:0:0:0:0:1' || /^127\./.test(host);
              if (!loopback) {
                fs.appendFileSync(logPath, JSON.stringify({host, port: options.port ?? null}) + '\n');
                throw new Error('FR05C_NETWORK_BLOCKED: verification cannot connect to a non-loopback service');
              }
            }
            return Reflect.apply(originalConnect, this, args);
          };
          GUARD

      - name: Generate framework declarations
        env:
          NODE_OPTIONS: --require=${{ runner.temp }}/fr05c-network-guard.cjs
        run: npm exec --offline -- next typegen

      - name: Check TypeScript
        env:
          NODE_OPTIONS: --require=${{ runner.temp }}/fr05c-network-guard.cjs
        run: npm run typecheck

      - name: Lint the corrected regression suites
        env:
          NODE_OPTIONS: --require=${{ runner.temp }}/fr05c-network-guard.cjs
        run: >-
          npm run lint --
          src/features/academic-content/pages/__tests__/AcademicContentWorkflow.test.tsx
          src/features/dashboard/__tests__/DashboardAnalyticsPage.test.tsx
          src/features/academic-content/components/editor/__tests__/FilesSectionUploadLifecycle.test.tsx
          src/features/academics/timetable/components/__tests__/TimetableConfigDialog.test.tsx

      - name: Run the complete unit suite
        env:
          NODE_OPTIONS: --require=${{ runner.temp }}/fr05c-network-guard.cjs
        run: npm run test:run

      - name: Verify tracked source remained unchanged
        run: git diff --quiet

      - name: Check for non-local connection attempts
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/fr05c-network-blocks.jsonl" ]; then
            cat "$RUNNER_TEMP/fr05c-network-blocks.jsonl"
            exit 1
          fi
